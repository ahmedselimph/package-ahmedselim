<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة التحكم — Ahmed Selim Photography</title><link rel="stylesheet" href="styles.css"><style>
.admin{max-width:1100px;margin:35px auto;padding:0 20px}.panel{background:#141414;border:1px solid var(--line);border-radius:20px;padding:24px;margin-bottom:18px}.admin h1,.admin h2{margin-top:0}.admin-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.admin-nav button{border:1px solid var(--line);background:#141414;color:var(--muted);border-radius:999px;padding:10px 17px;cursor:pointer}.admin-nav button.active{background:var(--primary);color:#111}.tab{display:none}.tab.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid label{font-size:12px;font-weight:800}.grid input,.grid textarea{display:block;width:100%;margin-top:5px;background:#0f0f0f;border:1px solid var(--line);color:var(--text);padding:11px;border-radius:10px}.wide{grid-column:1/-1}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer}.save{background:var(--primary);color:#111}.ghost{background:#202020;color:#eee;border:1px solid var(--line)}.danger{background:transparent;color:#ff9a9a;border:1px solid #542b2b}.item{border:1px solid var(--line);border-radius:15px;padding:16px;margin:12px 0}.hint{color:var(--muted);font-size:12px}.login{max-width:420px;margin:120px auto}.login input{width:100%;padding:13px;background:#0f0f0f;border:1px solid var(--line);color:#fff;border-radius:10px;margin:10px 0}.login button{width:100%}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body>
<header class="site-header"><div class="brand">لوحة تحكم <span>Ahmed Selim Photography</span></div><a href="index.html">فتح الموقع</a></header>
<div id="login" class="admin login panel"><h1>دخول لوحة التحكم</h1><p class="hint">هذه النسخة تحفظ الإعدادات على نفس المتصفح.</p><input id="pass" type="password" placeholder="كلمة المرور"><button class="btn save" id="loginBtn">دخول</button><p id="loginMsg" class="hint"></p></div>
<div id="app" class="admin" style="display:none">
<h1>لوحة التحكم</h1>
<div class="admin-nav"><button class="active" data-tab="design">التصميم</button><button data-tab="packages">الباقات</button><button data-tab="additional">الإضافات</button><button data-tab="backup">نسخ احتياطي</button></div>
<section class="panel tab active" id="design"><h2>التصميم والهوية</h2><div class="grid">
<label>اسم الموقع<input id="siteName"></label><label>رقم واتساب<input id="whatsapp"></label>
<label>العنوان الرئيسي<input id="heroTitle"></label><label>العنوان الفرعي<input id="heroSubtitle"></label>
<label>اللون الأساسي<input id="primary" type="color"></label><label>لون النص<input id="text" type="color"></label>
<label>الخلفية<input id="bg" type="color"></label><label>لون التفاصيل<input id="primary2" type="color"></label>
<label class="wide">التنويه<input id="noticeText"></label><label>عنوان الحجز<input id="bookingTitle"></label><label>وصف الحجز<input id="bookingSubtitle"></label>
</div><button class="btn save" id="saveDesign">حفظ التصميم</button></section>
<section class="panel tab" id="packages"><div class="row"><h2>باقات الأفراح</h2><button class="btn ghost" id="addPackage">+ إضافة</button></div><div id="packagesEditor"></div><button class="btn save" id="savePackages">حفظ الباقات</button></section>
<section class="panel tab" id="additional"><div class="row"><h2>الباقات الإضافية والإضافات</h2><button class="btn ghost" id="addAdditional">+ إضافة باقة</button></div><div id="additionalEditor"></div><button class="btn save" id="saveAdditional">حفظ</button></section>
<section class="panel tab" id="backup"><h2>نسخة احتياطية</h2><button class="btn ghost" id="export">تصدير الإعدادات</button> <label class="btn ghost">استيراد <input hidden id="import" type="file" accept=".json"></label><button class="btn danger" id="reset">استعادة الافتراضي</button></section>
</div>
<script>
const D={siteName:"Ahmed Selim Photography",heroTitle:"قائمة أسعار الباقات",heroSubtitle:"اختار باقتك وشوف السعر يتحدث قدامك أول بأول",primary:"#b68b5d",primary2:"#d2ad82",bg:"#0b0b0b",text:"#f5f1eb",whatsapp:"201000000000",noticeText:"جميع أسعار الباقات غير شاملة رسوم دخول الأماكن والانتقالات، ويتم الاتفاق عليها عبر واتساب.",bookingTitle:"بيانات الحجز",bookingSubtitle:"احنا محتاجين البيانات دي عشان نجهزلك العقد على طول",weddings:[{id:1,num:"1 HALF DAY",name:"نص يوم تصوير",price:5000,features:["تصوير سيشن زفاف","تصوير قاعة","طباعة ألبوم 30×80","بروز 50×70"]},{id:2,num:"2 FULL DAY",name:"يوم كامل - 12 ساعة",price:6000,features:["تصوير سيشن زفاف","تصوير تجهيزات","تصوير قاعة","طباعة ألبوم 30×80","بروز 50×70"]},{id:3,num:"3 DIFFERENT DAY",name:"تصوير على يومين مختلفين",price:8000,features:["تصوير سيشن زفاف","تصوير سيشن كاجوال","تصوير قاعة","طباعة ألبوم 30×80","بروز 50×70"]}],additional:[{id:1,title:"PARTY COVERING",desc:"اختار المناسبات اللي عايز تغطيتها، كل مناسبة 1,500 ج.م",price:1500,items:["زفاف","خطوبة","حنة","قاعة","كتب كتاب","كنيسة"]},{id:2,title:"SESSION (Soft copy)",desc:"اختار المناسبات اللي عايز سيشن لها، كل مناسبة 3,000 ج.م",price:2000,items:["زفاف","خطوبة","كتب كتاب","حنة"]}],extras:[{id:"hours",name:"ساعة إضافية",price:1000,unit:"/ ساعة"},{id:"ahmedselim",name:"مصور إضافي",price:1500,unit:""},{id:"second",name:"مصور ثانٍ",price:1000,unit:""}]};
let d=JSON.parse(localStorage.getItem("asp_config")||"null")||D;
const $=s=>document.querySelector(s), save=()=>localStorage.setItem("asp_config",JSON.stringify(d));
function fill(){siteName.value=d.siteName;whatsapp.value=d.whatsapp;heroTitle.value=d.heroTitle;heroSubtitle.value=d.heroSubtitle;primary.value=d.primary;text.value=d.text;bg.value=d.bg;primary2.value=d.primary2;noticeText.value=d.noticeText;bookingTitle.value=d.bookingTitle;bookingSubtitle.value=d.bookingSubtitle;drawP();drawA()}
function drawP(){packagesEditor.innerHTML=d.weddings.map((p,i)=>`<div class=item><div class=row><b>${i+1}. ${p.name}</b><button class="btn danger" onclick="d.weddings.splice(${i},1);drawP()">حذف</button></div><div class=grid><label>الترميز<input data-p=${i} data-k=num value="${p.num}"></label><label>الاسم<input data-p=${i} data-k=name value="${p.name}"></label><label>السعر<input type=number data-p=${i} data-k=price value="${p.price}"></label><label>المميزات<input data-p=${i} data-k=features value="${p.features.join(" | ")}"></label></div></div>`).join("")}
function drawA(){additionalEditor.innerHTML=d.additional.map((p,i)=>`<div class=item><div class=row><b>${p.title}</b><button class="btn danger" onclick="d.additional.splice(${i},1);drawA()">حذف</button></div><div class=grid><label>العنوان<input data-a=${i} data-k=title value="${p.title}"></label><label>السعر<input type=number data-a=${i} data-k=price value="${p.price}"></label><label>الوصف<input data-a=${i} data-k=desc value="${p.desc}"></label><label>العناصر<input data-a=${i} data-k=items value="${p.items.join(" | ")}"></label></div></div>`).join("")}
loginBtn.onclick=()=>{if(pass.value==="1234"){login.style.display="none";app.style.display="block";fill()}else loginMsg.textContent="كلمة المرور غير صحيحة."};
document.querySelectorAll(".admin-nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".admin-nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));$("#"+b.dataset.tab).classList.add("active")});
saveDesign.onclick=()=>{d={...d,siteName:siteName.value,whatsapp:whatsapp.value,heroTitle:heroTitle.value,heroSubtitle:heroSubtitle.value,primary:primary.value,text:text.value,bg:bg.value,primary2:primary2.value,noticeText:noticeText.value,bookingTitle:bookingTitle.value,bookingSubtitle:bookingSubtitle.value};save();alert("تم الحفظ")};
addPackage.onclick=()=>{d.weddings.push({id:Date.now(),num:"NEW PACKAGE",name:"باقة جديدة",price:0,features:[]});drawP()};
savePackages.onclick=()=>{packagesEditor.querySelectorAll("[data-p]").forEach(x=>{let p=d.weddings[+x.dataset.p],k=x.dataset.k;p[k]=k==="price"?Number(x.value):k==="features"?x.value.split("|").map(s=>s.trim()).filter(Boolean):x.value});save();alert("تم حفظ الباقات")};
addAdditional.onclick=()=>{d.additional.push({id:Date.now(),title:"NEW PACKAGE",desc:"",price:0,items:[]});drawA()};
saveAdditional.onclick=()=>{additionalEditor.querySelectorAll("[data-a]").forEach(x=>{let p=d.additional[+x.dataset.a],k=x.dataset.k;p[k]=k==="price"?Number(x.value):k==="items"?x.value.split("|").map(s=>s.trim()).filter(Boolean):x.value});save();alert("تم الحفظ")};
export.onclick=()=>{let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:"application/json"}));a.download="ahmed-selim-photography-settings.json";a.click()};
import.onchange=e=>{let r=new FileReader();r.onload=()=>{d=JSON.parse(r.result);save();fill();alert("تم الاستيراد")};r.readAsText(e.target.files[0])};
reset.onclick=()=>{if(confirm("استعادة الإعدادات الافتراضية؟")){d=structuredClone(D);save();fill()}};
</script></body></html>
